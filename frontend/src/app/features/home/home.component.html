<app-header></app-header>

<div class="bg-myntra-light min-h-screen">
  <div class="max-w-[1400px] mx-auto px-4 md:px-10 py-8">
    <h1 class="text-2xl md:text-3xl font-extrabold text-myntra-dark mb-8 tracking-wide">
      SHOP BY CATEGORY
    </h1>

    <div *ngIf="loading" class="text-center py-20 text-myntra-gray">Loading categories...</div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <app-category-card
        *ngFor="let cat of categories"
        [name]="cat.name"
        [imageUrl]="cat.imageUrl"
        [discountText]="cat.discountText"
        [slug]="cat.slug">
      </app-category-card>
    </div>
  </div>
</div>
