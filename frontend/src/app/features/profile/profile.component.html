<app-header></app-header>

<div class="max-w-[600px] mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-myntra-dark mb-8">My Profile</h1>

  <div class="bg-white border border-gray-200 p-6 rounded-sm">
    <div class="flex items-center gap-4 mb-6">
      <div class="w-16 h-16 bg-myntra-pink rounded-full flex items-center justify-center text-white text-2xl font-bold">
        {{ user?.name?.charAt(0)?.toUpperCase() }}
      </div>
      <div>
        <h2 class="text-xl font-bold">{{ user?.name }}</h2>
        <p class="text-myntra-gray text-sm">{{ user?.email }}</p>
      </div>
    </div>

    <hr class="my-4" />

    <div class="space-y-4">
      <a routerLink="/cart" class="block text-sm font-bold hover:text-myntra-pink">My Orders</a>
      <a routerLink="/wishlist" class="block text-sm font-bold hover:text-myntra-pink">My Wishlist</a>
      <a routerLink="/cart" class="block text-sm font-bold hover:text-myntra-pink">My Bag</a>
    </div>

    <hr class="my-6" />

    <button (click)="logout()" class="myntra-btn-outline w-full text-center">LOGOUT</button>
  </div>
</div>
