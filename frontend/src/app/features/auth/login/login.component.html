<div class="min-h-screen bg-myntra-light flex items-center justify-center px-4">
  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <svg class="mx-auto mb-4" width="56" height="40" viewBox="0 0 56 40" fill="none">
        <path d="M28 0L0 40H16L28 20L40 40H56L28 0Z" fill="url(#loginGrad)"/>
        <defs>
          <linearGradient id="loginGrad" x1="0" y1="0" x2="56" y2="40">
            <stop stop-color="#FF3F6C"/><stop offset="1" stop-color="#FF905A"/>
          </linearGradient>
        </defs>
      </svg>
      <h1 class="text-2xl font-bold text-myntra-dark">Login to ShopEase</h1>
      <p class="text-myntra-gray text-sm mt--1">Your fashion destination</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-bold text-myntra-gray mb-1">Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email"
               class="w-full border border-gray-300 rounded-sm px-4 py-3 text-sm outline-none focus:border-myntra-pink" />
        <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
           class="text-myntra-pink text-xs mt-1">Valid email is required</p>
      </div>

      <div class="mb-6">
        <label class="block text-sm font-bold text-myntra-gray mb-1">Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password"
               class="w-full border border-gray-300 rounded-sm px-4 py-3 text-sm outline-none focus:border-myntra-pink" />
        <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
           class="text-myntra-pink text-xs mt-1">Password must be at least 6 characters</p>
      </div>

      <p *ngIf="errorMessage" class="text-myntra-pink text-sm mb-4 text-center">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading || loginForm.invalid"
              class="myntra-btn w-full text-center disabled:opacity-50">
        {{ loading ? 'Logging in...' : 'LOGIN' }}
      </button>
    </form>

    <p class="text-center text-sm text-myntra-gray mt-6">
      New to ShopEase?
      <a routerLink="/register" class="text-myntra-pink font-bold hover:underline">Create an account</a>
    </p>
  </div>
</div>
