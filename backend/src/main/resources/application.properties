spring.application.name=ecommerce-backend

# Render sets PORT automatically
server.port=${PORT:8080}

# Database (override on Render with env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (MUST set a strong secret on Render)
jwt.secret=${JWT_SECRET:MyntraStyleEcommerceSecretKeyForJWTTokenGeneration2026MustBeLongEnough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - comma-separated list of frontend origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
